services:
  postgres_test:
    image: postgres:16-alpine
    container_name: fasobet-postgres-test
    environment:
      POSTGRES_DB: fasobet_test
      POSTGRES_USER: fasobet
      POSTGRES_PASSWORD: changeme_in_prod
    ports:
      - "5434:5432"
    networks:
      - fasobet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasobet -d fasobet_test"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  fasobet-net:
    external: true
