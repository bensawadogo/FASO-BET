{% extends "predictions/base.html" %}
{% block title %}Classements en Direct — FASO BET{% endblock %}

{% block content %}
<div class="pt-32 px-6 max-w-7xl mx-auto pb-32">
  <div class="text-center mb-12 fade-up">
    <h1 class="text-4xl md:text-5xl font-headline font-bold text-white mb-4">🏆 Classements en direct</h1>
    <p class="text-on-surface-variant">Données officielles API-Football en temps réel</p>
  </div>

  <!-- Selecteur de Ligue -->
  <div class="flex flex-wrap justify-center gap-4 mb-12 fade-up">
    <button onclick="fetchStandings(39)" class="px-6 py-2 rounded-full border border-white/10 hover:bg-white/10 transition text-sm">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
    <button onclick="fetchStandings(61)" class="px-6 py-2 rounded-full border border-white/10 hover:bg-white/10 transition text-sm">🇫🇷 Ligue 1</button>
    <button onclick="fetchStandings(140)" class="px-6 py-2 rounded-full border border-white/10 hover:bg-white/10 transition text-sm">🇪🇸 La Liga</button>
    <button onclick="fetchStandings(78)" class="px-6 py-2 rounded-full border border-white/10 hover:bg-white/10 transition text-sm">🇩🇪 Bundesliga</button>
    <button onclick="fetchStandings(135)" class="px-6 py-2 rounded-full border border-white/10 hover:bg-white/10 transition text-sm">🇮🇹 Serie A</button>
    <button onclick="fetchStandings(2)" class="px-6 py-2 rounded-full border border-white/10 hover:bg-white/10 transition text-sm">🇪🇺 Champions League</button>
  </div>

  <div id="standings-loading" class="text-center py-12 hidden">
    <span class="material-symbols-outlined animate-spin text-4xl text-cyan-400 mb-2" style="animation: spin 1s linear infinite;">autorenew</span>
    <p class="text-on-surface-variant animate-pulse">Récupération du classement...</p>
  </div>

  <div id="standings-container" class="glass-card rounded-xl border border-white/5 overflow-hidden fade-up hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-on-surface-variant">
        <thead class="bg-black/30 text-white font-label text-xs uppercase tracking-wider border-b border-white/10">
          <tr>
            <th class="px-6 py-4">#</th>
            <th class="px-6 py-4">Équipe</th>
            <th class="px-4 py-4 text-center text-cyan-300">PTS</th>
            <th class="px-4 py-4 text-center">J</th>
            <th class="px-4 py-4 text-center">V</th>
            <th class="px-4 py-4 text-center">N</th>
            <th class="px-4 py-4 text-center">D</th>
            <th class="px-4 py-4 text-center">Buts</th>
            <th class="px-4 py-4 text-center">Forme</th>
          </tr>
        </thead>
        <tbody id="standings-body" class="divide-y divide-white/5">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API_KEY = "{{ api_football_key|escapejs }}";
  // The current active season for major leagues is 2024 (e.g. 24/25 season)
  const currentYear = 2024; 

  async function fetchStandings(leagueId) {
    if (!API_KEY) {
      alert("Clé API-Football manquante dans le fichier .env !"); 
      return;
    }
    document.getElementById('standings-container').classList.add('hidden');
    document.getElementById('standings-loading').classList.remove('hidden');
    
    try {
      const res = await fetch(`https://v3.football.api-sports.io/standings?league=${leagueId}&season=${currentYear}`, {
        headers: { "x-apisports-key": API_KEY }
      });
      const data = await res.json();
      
      const tbody = document.getElementById('standings-body');
      tbody.innerHTML = '';

      if (data.response.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-on-surface-variant/60">Aucune donnée disponible pour cette saison.</td></tr>';
      } else {
        // Some competitions like Champions League have multiple groups. We just display all teams flat or pick the first group for now.
        const allStandings = data.response[0].league.standings;
        
        allStandings.forEach(group => {
          group.forEach(team => {
            let formHtml = '';
            if (team.form) {
              formHtml = team.form.split('').map(res => {
                const color = res === 'W' ? 'bg-green-500' : res === 'D' ? 'bg-gray-500' : 'bg-red-500';
                return `<span class="inline-block w-4 h-4 rounded-sm text-[10px] text-white text-center leading-4 ${color} mx-[1px] shadow-sm">${res}</span>`;
              }).join('');
            }

            tbody.innerHTML += `
              <tr class="hover:bg-white/[0.04] transition-colors">
                <td class="px-6 py-4 font-bold text-white">${team.rank}</td>
                <td class="px-6 py-4 font-bold text-white flex items-center gap-3">
                  <img src="${team.team.logo}" class="w-6 h-6 object-contain" alt="logo">
                  ${team.team.name}
                </td>
                <td class="px-4 py-4 text-center font-bold text-cyan-400">${team.points}</td>
                <td class="px-4 py-4 text-center">${team.all.played}</td>
                <td class="px-4 py-4 text-center">${team.all.win}</td>
                <td class="px-4 py-4 text-center">${team.all.draw}</td>
                <td class="px-4 py-4 text-center">${team.all.lose}</td>
                <td class="px-4 py-4 text-center text-xs opacity-70">${team.all.goals.for}:${team.all.goals.against}</td>
                <td class="px-4 py-4 text-center flex justify-center items-center h-full">${formHtml}</td>
              </tr>
            `;
          });
        });
      }
      
      document.getElementById('standings-loading').classList.add('hidden');
      document.getElementById('standings-container').classList.remove('hidden');
    } catch(err) {
      console.error(err);
      alert("Erreur lors de la récupération des classements.");
      document.getElementById('standings-loading').classList.add('hidden');
    }
  }

  // Lancement automatique au chargement
  window.addEventListener('DOMContentLoaded', () => {
    fetchStandings(39); // Premier League by default
  });
</script>
{% endblock %}
