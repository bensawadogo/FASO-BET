x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-env: &default-env
  ENV: ${ENV:-production}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fasobet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fasobet}
      POSTGRES_USER: ${POSTGRES_USER:-fasobet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fasobet} -d ${POSTGRES_DB:-fasobet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: fasobet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256m --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    image: fasobet-django:latest
    container_name: fasobet-django
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: sportpred.settings
    ports:
      - "8002:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8001/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./ml/data:/app/ml/data
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    image: fasobet-celery-worker:latest
    container_name: fasobet-celery-worker
    restart: on-failure:3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    image: fasobet-celery-beat:latest
    container_name: fasobet-celery-beat
    restart: on-failure:3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A sportpred beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    image: fasobet-fastapi:latest
    container_name: fasobet-fastapi
    restart: on-failure:3
    depends_on:
      django:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      DJANGO_INTERNAL_URL: http://django:8001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://nextjs:3001}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
      target: runner
      args:
        NEXT_PUBLIC_DJANGO_URL: ${NEXT_PUBLIC_DJANGO_URL:-http://localhost:8002}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
        NEXT_PUBLIC_FASTAPI_URL: ${NEXT_PUBLIC_FASTAPI_URL:-http://localhost:8000}
    image: fasobet-nextjs:latest
    container_name: fasobet-nextjs
    restart: on-failure:3
    depends_on:
      django:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      # URLs CLIENT (navigateur) — resolvent depuis le PC/navigateur
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
      NEXT_PUBLIC_FASTAPI_URL: ${NEXT_PUBLIC_FASTAPI_URL:-http://localhost:8000}
      NEXT_PUBLIC_DJANGO_URL: ${NEXT_PUBLIC_DJANGO_URL:-http://localhost:8002}
      # URLs SSR (serveur Next.js) — resolvent via DNS Docker
      API_DJANGO_URL: ${API_DJANGO_URL:-http://django:8001}
      API_FASTAPI_URL: ${API_FASTAPI_URL:-http://fastapi:8000}
      NODE_ENV: production
    ports:
      - "3001:3001"
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    image: fasobet-ai-gateway:latest
    container_name: fasobet-ai-gateway
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      DATABASE_URL: postgresql://fasobet:changeme_prod@postgres:5432/fasobet
    ports:
      - "8100:8100"
    logging: *default-logging
    networks:
      - fasobet-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  fasobet-net:
    name: fasobet-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
