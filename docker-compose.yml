# ──────────────────────────────────────────────────────────
# FasoBet — Docker Compose (BLOC 3)
# 7 services : Postgres · Redis · Django · Next.js · FastAPI · Celery · Celery Beat
# ──────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-env: &default-env
  ENV: ${ENV:-development}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

services:

  # ─── Base de données principale ────────────────────────
  # Initialisation via scripts/init-db.sql
  postgres:
    image: postgres:16-alpine
    container_name: fasobet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fasobet}
      POSTGRES_USER: ${POSTGRES_USER:-fasobet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fasobet} -d ${POSTGRES_DB:-fasobet}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - fasobet-net

  # ─── Cache Redis (broker Celery + cache distribué) ─────
  redis:
    image: redis:7-alpine
    container_name: fasobet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - fasobet-net

  # ─── Django Control Plane ──────────────────────────────
  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: fasobet-django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - django_static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - fasobet-net

  # ─── Next.js Frontend ──────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    container_name: fasobet-nextjs
    restart: unless-stopped
    depends_on:
      django:
        condition: service_started
      fastapi:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      # URLs navigateur (résolues côté client)
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_FASTAPI_URL: http://localhost:8001
      NEXT_PUBLIC_DJANGO_URL: http://localhost:8000
      # URLs SSR (résolues côté serveur via Docker)
      FASTAPI_INTERNAL_URL: http://fastapi:8001
      DJANGO_INTERNAL_URL: http://django:8000
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - fasobet-net

  # ─── FastAPI Inference Engine (BLOC 2) ─────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fasobet-fastapi
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      FASTAPI_REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://nextjs:3000,http://localhost:3001
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - fasobet-net

  # ─── Celery Worker (pipeline async) ────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: fasobet-celery
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FASTAPI_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    logging: *default-logging
    networks:
      - fasobet-net

  # ─── Celery Beat (tâches périodiques) ──────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: fasobet-celery-beat
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      <<: *default-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: ["celery", "-A", "api.tasks", "beat", "--loglevel=info"]
    volumes:
      - .:/app
    logging: *default-logging
    networks:
      - fasobet-net

networks:
  fasobet-net:
    name: fasobet-network
    driver: bridge

volumes:
  postgres_data:
    name: fasobet-postgres-data
  redis_data:
    name: fasobet-redis-data
  django_static:
    name: fasobet-django-static
